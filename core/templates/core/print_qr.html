{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Print QR - Table {{ table.table_number }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-white">

    <div class="text-center">
        <h1 class="text-2xl font-bold mb-2">
            Table {{ table.table_number }}
        </h1>

        <p class="text-gray-500 mb-4">
            Scan to view the menu and place your order
        </p>

        {% if qr_absolute_url %}
            <img src="{{ qr_absolute_url }}"
                class="w-64 h-64 mx-auto mb-6">
        {% else %}
            <p>No QR code available.</p>
        {% endif %}
        <button onclick="window.print()"
                class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 print:hidden">
            Print QR Code
        </button>
    </div>

</body>
</html>

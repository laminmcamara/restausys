<!DOCTYPE html>
<html>
<head>
    <title>Order | Table {{ table.table_number }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="font-family: system-ui; padding:16px; background:#f9fafb;">

<h1>Table {{ table.table_number }}</h1>
<p>Select your items</p>

{% csrf_token %}

{% for category, items in categorized_menu.items %}
    <h2 style="margin-top:30px;">{{ category }}</h2>

    {% for item in items %}
        <div style="background:white; padding:12px; margin-top:10px; border-radius:8px;">
            <strong>{{ item.name }}</strong>
            <p>{{ item.description }}</p>

            <button onclick="changeQty({{ item.id }}, -1)">−</button>
            <span id="qty-{{ item.id }}">0</span>
            <button onclick="changeQty({{ item.id }}, 1)">+</button>

            <button onclick="addToCart({{ item.id }})">
                Add
            </button>
        </div>
    {% endfor %}
{% endfor %}

<button onclick="goToCheckout()" 
        style="position:fixed; bottom:20px; right:20px; padding:12px 20px;">
    Checkout (<span id="cartCount">0</span>)
</button>

<script>
const token = "{{ table.access_token }}";

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");
        for (let cookie of cookies) {
            cookie = cookie.trim();
            if (cookie.startsWith(name + "=")) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

function changeQty(id, amount) {
    const el = document.getElementById("qty-" + id);
    let value = parseInt(el.innerText);
    value = Math.max(0, value + amount);
    el.innerText = value;
}

async function addToCart(id) {
    const qtyEl = document.getElementById("qty-" + id);
    const quantity = parseInt(qtyEl.innerText);

    if (quantity <= 0) return;

    const response = await fetch(`/api/table/${token}/cart/`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie("csrftoken")
        },
        body: JSON.stringify({
            item_id: id,
            quantity: quantity
        })
    });

    if (response.ok) {
        const data = await response.json();
        document.getElementById("cartCount").innerText = data.cart_count;
        qtyEl.innerText = 0;
    } else {
        alert("Failed to add item.");
    }
}

function goToCheckout() {
    window.location = `/table/${token}/checkout/`;
}
</script>

</body>
</html>

{% extends "core/dashboard_base.html" %}
{% load static %}

{% block title %}Your Order Status{% endblock %}

{% block content %}

<style>
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in {
    animation: fadeInUp 0.6s ease-out;
}
</style>

<div class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800 flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-2xl">

        <!-- LOADING STATE -->
        <div id="loading-state"
             class="bg-white/10 backdrop-blur-xl rounded-2xl p-12 text-center shadow-2xl border border-white/20">

            <div class="flex flex-col items-center gap-6 text-white">
                <div class="h-14 w-14 border-4 border-white/30 border-t-white rounded-full animate-spin"></div>
                <div>
                    <h2 class="text-2xl font-semibold">
                        Connecting to your order…
                    </h2>
                    <p class="text-white/70 mt-3">
                        Fetching live updates.
                    </p>
                </div>
            </div>
        </div>

        <!-- ERROR STATE -->
        <div id="error-state" class="hidden">
            <div class="bg-white rounded-2xl shadow-xl p-10 text-center border border-red-200">
                <h2 class="text-2xl font-bold text-red-600 mb-4">
                    No Active Order
                </h2>
                <p id="error-message" class="text-slate-600"></p>
            </div>
        </div>

        <!-- ORDER STATE -->
        <div id="order-state" class="hidden">

            <div class="bg-white rounded-2xl shadow-[0_30px_80px_rgba(0,0,0,0.35)] p-8 md:p-12 animate-fade-in">

                <!-- HEADER -->
                <div class="text-center mb-8">

                    <p class="text-sm uppercase tracking-widest text-slate-400">
                        Order
                    </p>

                    <h1 id="order-id"
                        class="text-4xl md:text-5xl font-extrabold text-slate-900 mt-2">
                    </h1>

                    <p class="text-slate-500 mt-2 text-lg">
                        Table <span id="order-table" class="font-semibold"></span>
                    </p>

                </div>

                <!-- Divider -->
                <div class="border-t border-dashed border-slate-300 my-6"></div>

                <!-- ITEMS -->
                <div id="order-items-list"
                     class="space-y-6 text-lg">
                </div>

                <!-- Divider -->
                <div class="border-t border-dashed border-slate-300 my-6"></div>

                <!-- TOTAL -->
                <div class="flex justify-between items-center text-2xl font-bold text-slate-900">
                    <span>Total</span>
                    <span id="order-total"></span>
                </div>

                <!-- STATUS -->
                <div class="mt-10 text-center">

                    <div id="order-status-badge"
                         class="inline-block px-12 py-4 rounded-xl text-2xl font-extrabold tracking-wide text-white shadow-lg transition-all duration-300">
                        <span id="order-status-text"></span>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const states = {
        loading: document.getElementById("loading-state"),
        error: document.getElementById("error-state"),
        order: document.getElementById("order-state")
    };

    const el = {
        id: document.getElementById("order-id"),
        table: document.getElementById("order-table"),
        itemsList: document.getElementById("order-items-list"),
        total: document.getElementById("order-total"),
        badge: document.getElementById("order-status-badge"),
        statusText: document.getElementById("order-status-text")
    };

    function showState(name) {
        Object.values(states).forEach(s => s.classList.add("hidden"));
        states[name]?.classList.remove("hidden");
    }

    function readable(status) {
        switch (status) {
            case "DRAFT": return "Draft";
            case "PLACED": return "Order Placed";
            case "IN_PROGRESS": return "Preparing";
            case "READY": return "Ready";
            case "SERVED": return "Served";
            case "COMPLETED": return "Completed";
            case "CANCELED": return "Canceled";
            default: return status;
        }
    }

    const tableId = "{{ table_id }}";
    const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
    const socket = new WebSocket(
        `${wsScheme}://${window.location.host}/ws/table/${tableId}/`
    );

    socket.onmessage = function (event) {
        const data = JSON.parse(event.data);

        if (data.type === "order_update" && data.order) {
            render(data.order);
            showState("order");
        }
    };

    function render(order) {

        el.id.textContent = `#${order.display_id.toUpperCase()}`;
        el.table.textContent = order.table;

        el.itemsList.innerHTML = order.items.map(item => `
            <div class="flex justify-between items-start">
                <div>
                    <p class="font-semibold text-slate-900 text-xl">
                        ${item.product.name}
                    </p>
                    <p class="text-slate-500 text-sm mt-1">
                        x${item.quantity}
                    </p>
                </div>
                <div class="font-semibold text-slate-800 text-xl">
                    $${parseFloat(item.final_price).toFixed(2)}
                </div>
            </div>
        `).join("");

        const total = order.items.reduce(
            (sum, item) => sum + parseFloat(item.final_price),
            0
        );

        el.total.textContent = `$${total.toFixed(2)}`;

        updateStatus(order.status);
    }

    function updateStatus(status) {

        el.badge.className =
            "inline-block px-12 py-4 rounded-xl text-2xl font-extrabold tracking-wide text-white shadow-lg transition-all duration-300";

        el.statusText.textContent = readable(status);

        switch (status) {

            case "DRAFT":
                el.badge.classList.add("bg-slate-600");
                break;

            case "PLACED":
            case "IN_PROGRESS":
                el.badge.classList.add("bg-orange-600");
                break;

            case "READY":
                el.badge.classList.add("bg-green-600");
                break;

            case "SERVED":
            case "COMPLETED":
                el.badge.classList.add("bg-blue-700");
                break;

            case "CANCELED":
                el.badge.classList.add("bg-red-600");
                break;

            default:
                el.badge.classList.add("bg-slate-600");
        }
    }

    showState("loading");
});
</script>

{% endblock %}

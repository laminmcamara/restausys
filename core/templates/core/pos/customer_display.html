{% extends "core/dashboard_base.html" %}
{% load static %}

{% block title %}Your Order Status{% endblock %}

{% block dashboard_content %}
<div class="flex flex-col items-center justify-center min-h-[60vh] p-4 text-center">

    <!-- Loading State -->
    <div id="loading-state">
        <div class="flex flex-col items-center gap-4 text-slate-500 dark:text-slate-400">
            <svg class="animate-spin h-12 w-12 text-amber-600"
                 xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24">
                <circle class="opacity-25"
                        cx="12"
                        cy="12"
                        r="10"
                        stroke="currentColor"
                        stroke-width="4"></circle>
                <path class="opacity-75"
                    fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <h2 class="text-2xl font-semibold">Connecting to your order...</h2>
            <p>Please wait a moment.</p>
        </div>
    </div>

    <!-- Error State -->
    <div id="error-state" class="hidden">
        <div class="w-full max-w-md p-8 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl text-red-700 dark:text-red-300">
            <h2 class="text-2xl font-bold mb-4">Notice</h2>
            <p id="error-message" class="text-center">
                There is no active order for this table.
            </p>
        </div>
    </div>

    <!-- Order Display State -->
    <div id="order-state" class="hidden w-full max-w-lg">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-lg p-6 md:p-8">

            <div class="flex justify-between items-start mb-4">
                <div class="mb-6">
                    <h1 class="text-3xl font-bold text-gray-900 dark:text-white">
                        Your Order
                    </h1>
                    <p class="text-gray-500 dark:text-gray-400">
                        Table: <span id="order-table" class="font-semibold"></span>
                    </p>
                </div>

                <div class="text-right">
                    <span class="text-xs text-slate-400 dark:text-slate-500">
                        ORDER ID
                    </span>
                    <p id="order-id"
                       class="font-mono text-lg font-semibold text-slate-800 dark:text-slate-200"></p>
                </div>
            </div>

            <div class="my-6 border-t border-b border-slate-200 dark:border-slate-700">
                <ul id="order-items-list"
                    class="divide-y divide-slate-200 dark:divide-slate-700"></ul>
            </div>

            <div class="text-center">

                <div id="order-status-badge"
                     class="inline-flex items-center gap-3 px-6 py-3 rounded-full font-semibold text-lg transition-all duration-300">
                    <span id="order-status-text"></span>
                </div>

                <p id="order-status-message"
                    class="mt-4 text-slate-600 dark:text-slate-300"></p>

                <!-- Estimated Time -->
                <div id="order-estimate" class="mt-6 hidden">
                    <div class="bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-800 rounded-xl p-4 text-center">
                        <p id="order-estimate-text" class="font-semibold text-amber-800 dark:text-amber-300"></p>
                        <p id="order-countdown" class="text-2xl font-bold mt-2"></p>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const states = {
        loading: document.getElementById("loading-state"),
        error: document.getElementById("error-state"),
        order: document.getElementById("order-state")
    };

    const orderElements = {
        id: document.getElementById("order-id"),
        table: document.getElementById("order-table"),
        itemsList: document.getElementById("order-items-list"),
        statusBadge: document.getElementById("order-status-badge"),
        statusText: document.getElementById("order-status-text"),
        statusMessage: document.getElementById("order-status-message"),
        errorMessage: document.getElementById("error-message"),
        estimateWrapper: document.getElementById("order-estimate"),
        estimateText: document.getElementById("order-estimate-text"),
        countdown: document.getElementById("order-countdown")
    };

    function showState(name) {
        Object.values(states).forEach(el => el.classList.add("hidden"));
        states[name]?.classList.remove("hidden");
    }

    function getReadableStatus(status) {
        switch (status) {
            case "PLACED":
                return "Order Placed";
            case "IN_PROGRESS":
                return "Cooking";
            case "READY":
                return "Ready for Pickup";
            case "SERVED":
                return "Served";
            case "COMPLETED":
                return "Completed";
            case "CANCELED":
                return "Canceled";
            default:
                return status;
        }
    }

    const tableId = "{{ table_id }}";

    if (!tableId) {
        orderElements.errorMessage.textContent =
            "Configuration error: Table ID missing.";
        showState("error");
        return;
    }

    const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
    const socket = new WebSocket(
        `${wsScheme}://${window.location.host}/ws/table/${tableId}/`
    );

    socket.onmessage = function (event) {
        const data = JSON.parse(event.data);

        if (data.type === "order_update") {
            const order = data.order;

            if (!order) {
                showState("loading");
                return;
            }

            renderCustomerOrder(order);
            showState("order");
        }
    };

    let countdownInterval = null;

    function renderCustomerOrder(order) {

        orderElements.id.textContent = `#${order.display_id}`;
        orderElements.table.textContent = order.table;

        orderElements.itemsList.innerHTML = order.items.map(item => `
            <li class="flex items-center justify-between py-4 border-b border-gray-200 dark:border-gray-700">
        
                <div class="flex flex-col">
                    <span class="text-lg font-semibold text-gray-900 dark:text-white">
                        ${item.product.name}
                    </span>
                    <span class="text-sm text-gray-500 dark:text-gray-400">
                        Qty: ${item.quantity}
                    </span>
                </div>

                <div class="text-lg font-semibold text-gray-900 dark:text-white">
                    $${parseFloat(item.final_price).toFixed(2)}
                </div>

            </li>
`       ).join("");

        const badge = orderElements.statusBadge;

        badge.className =
            "inline-flex items-center gap-3 px-6 py-3 rounded-full font-semibold text-lg transition-all duration-300";

        orderElements.statusText.textContent = getReadableStatus(order.status);
        orderElements.statusMessage.textContent = "";

        if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }

        const estimatedMinutes = order.estimated_time || 0;

        switch (order.status) {

            case "PLACED":
            case "IN_PROGRESS":

                badge.classList.add(
                    "bg-amber-100",
                    "text-amber-800",
                    "dark:bg-amber-900/40",
                    "dark:text-amber-300"
                );

                if (estimatedMinutes > 0) {
                    orderElements.estimateWrapper.classList.remove("hidden");
                    orderElements.estimateText.textContent =
                        `Estimated time: ${estimatedMinutes} minutes`;
                    startCountdown(estimatedMinutes);
                } else {
                    orderElements.estimateWrapper.classList.add("hidden");
                }

                break;

            case "READY":

                badge.classList.add(
                    "bg-emerald-100",
                    "text-emerald-800",
                    "dark:bg-emerald-900/40",
                    "dark:text-emerald-300"
                );

                orderElements.statusMessage.textContent =
                    "Your order is ready!";
                orderElements.estimateWrapper.classList.add("hidden");

                break;

            case "SERVED":
            case "COMPLETED":

                badge.classList.add(
                    "bg-blue-100",
                    "text-blue-800",
                    "dark:bg-blue-900/40",
                    "dark:text-blue-300"
                );

                orderElements.statusMessage.textContent =
                    "Enjoy your meal!";
                orderElements.estimateWrapper.classList.add("hidden");

                break;

            case "CANCELED":

                badge.classList.add(
                    "bg-red-100",
                    "text-red-800",
                    "dark:bg-red-900/40",
                    "dark:text-red-300"
                );

                orderElements.statusMessage.textContent =
                    "This order was canceled.";
                orderElements.estimateWrapper.classList.add("hidden");

                break;

            default:
                orderElements.estimateWrapper.classList.add("hidden");
        }
    }

    function startCountdown(minutes) {

        let remaining = minutes * 60;

        function updateDisplay() {
            const mins = Math.floor(remaining / 60);
            const secs = remaining % 60;

            orderElements.countdown.textContent =
                `${mins}:${secs.toString().padStart(2, "0")}`;
        }

        updateDisplay();

        countdownInterval = setInterval(() => {

            remaining--;

            if (remaining <= 0) {
                clearInterval(countdownInterval);
                orderElements.countdown.textContent = "Almost ready!";
                return;
            }

            updateDisplay();

        }, 1000);
    }

    showState("loading");
});
</script>
{% endblock %}

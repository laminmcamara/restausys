{% extends "core/dashboard_base.html" %}
{% load static %}

{% block title %}Pickup Display{% endblock %}

{% block content %}

<style>
@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}
@keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 0px rgba(34,197,94,0); }
    50% { box-shadow: 0 0 40px rgba(34,197,94,0.9); }
}
.order-card {
    animation: fadeIn 0.4s ease-out;
}
.ready-glow {
    animation: pulseGlow 2s infinite;
}
</style>

<div class="min-h-screen bg-black text-white flex flex-col">

    <!-- HEADER -->
    <div class="text-center py-8 border-b border-slate-800">

        <h1 class="text-6xl font-extrabold tracking-wide">
            {{ restaurant.name }}
        </h1>

        <p class="text-slate-400 text-xl mt-3">
            Order Pickup Status
        </p>

    </div>

    <!-- MAIN GRID -->
    <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-8 p-10">

        <!-- PREPARING COLUMN -->
        <div class="flex flex-col">

            <h2 class="text-4xl font-bold text-yellow-400 text-center mb-8 tracking-wide">
                Preparing
            </h2>

            <div id="preparing-list"
                 class="flex-1 grid grid-cols-2 lg:grid-cols-3 gap-8 content-start">
            </div>

        </div>

        <!-- READY COLUMN -->
        <div class="flex flex-col">

            <h2 class="text-4xl font-bold text-green-400 text-center mb-8 tracking-wide">
                Ready for Pickup
            </h2>

            <div id="ready-list"
                 class="flex-1 grid grid-cols-2 lg:grid-cols-3 gap-8 content-start">
            </div>

        </div>

    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const restaurantId = "{{ restaurant.id }}";
    const wsScheme = location.protocol === "https:" ? "wss" : "ws";

    const socket = new WebSocket(
        `${wsScheme}://${window.location.host}/ws/customer/${restaurantId}/`
    );

    const preparingList = document.getElementById("preparing-list");
    const readyList = document.getElementById("ready-list");

    socket.onmessage = function (event) {
        const data = JSON.parse(event.data);

        if (data.type === "pickup_update") {
            renderPreparing(data.now_preparing || []);
            renderReady(data.ready || []);
        }
    };

    function renderPreparing(orders) {

        preparingList.innerHTML = "";

        if (orders.length === 0) {
            preparingList.innerHTML =
                "<div class='col-span-full text-slate-600 text-2xl text-center'>No Orders</div>";
            return;
        }

        orders.forEach(number => {

            const div = document.createElement("div");

            div.className =
                "order-card bg-yellow-400 text-black rounded-2xl py-10 text-5xl font-extrabold text-center shadow-2xl";

            div.innerText = "#" + number;

            preparingList.appendChild(div);
        });
    }

    function renderReady(orders) {

        readyList.innerHTML = "";

        if (orders.length === 0) {
            readyList.innerHTML =
                "<div class='col-span-full text-slate-600 text-2xl text-center'>No Orders</div>";
            return;
        }

        orders.forEach(number => {

            const div = document.createElement("div");

            div.className =
                "order-card ready-glow bg-green-500 text-black rounded-2xl py-10 text-5xl font-extrabold text-center shadow-2xl";

            div.innerText = "#" + number;

            readyList.appendChild(div);
        });
    }

});
</script>

{% endblock %}

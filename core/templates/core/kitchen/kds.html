{% extends "core/dashboard_base.html" %}
{% load static %}

{% block content %}
<style>
    :root {
        --bg-color: #2b2b2b;
        --ticket-bg: #ffffff;
        --header-bg: #1a1a1a;
        --header-text: #ffffff;
        --border-color: #444444;
        --shadow-color: rgba(0, 0, 0, 0.2);

        --status-preparing: #337ab7;
        --status-ready: #5cb85c;
        --status-completed: #777777;

        --timer-normal: #333;
        --timer-warn: #f0ad4e;
        --timer-urgent: #d9534f;
    }

    body {
        background-color: var(--bg-color);
        margin: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
    }

    .kds-header {
        background: var(--header-bg);
        color: var(--header-text);
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid var(--border-color);
    }

    .ticket-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
        gap: 2rem;
        padding: 2rem;
    }

    .ticket {
        background: var(--ticket-bg);
        border-radius: 12px;
        box-shadow: 0 8px 16px var(--shadow-color);
        display: flex;
        flex-direction: column;
        border-top: 10px solid var(--status-preparing);
    }

    .ticket.status-READY { border-top-color: var(--status-ready); }
    .ticket.status-COMPLETED { border-top-color: var(--status-completed); }

    .ticket-header {
        padding: 1rem 1.5rem;
        border-bottom: 2px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .ticket-info h2 {
        margin: 0;
        font-size: 2.3rem;
        font-weight: 700;
    }

    .ticket-timer {
        font-size: 2rem;
        font-weight: 700;
    }

    .ticket-body {
        padding: 1.5rem;
        flex-grow: 1;
    }

    .ticket-body li {
        font-size: 1.8rem;
        font-weight: 600;
        margin-bottom: 1rem;
        display: flex;
        border-bottom: 1px dashed #ccc;
        padding-bottom: 1rem;
    }

    .item-quantity {
        font-weight: 800;
        font-size: 2rem;
        margin-right: 1rem;
    }

    .ticket-footer {
        padding: 1rem;
        text-align: center;
        background: #f9f9f9;
    }

    .action-button {
        border: none;
        padding: 1rem;
        font-size: 1.3rem;
        font-weight: bold;
        border-radius: 8px;
        width: 90%;
        color: white;
        cursor: pointer;
    }

    .btn-ready { background: var(--status-ready); }
    .btn-complete { background: var(--status-completed); }

    .no-tickets {
        text-align: center;
        font-size: 2.5rem;
        color: #999;
        grid-column: 1 / -1;
    }

    /* ✅ Flash animation for new ticket */
    @keyframes flashNew {
        0% { transform: scale(1.05); box-shadow: 0 0 30px #5cb85c; }
        100% { transform: scale(1); }
    }

    .new-ticket {
        animation: flashNew 0.6s ease;
    }
</style>

<header class="kds-header">
    <h1>Kitchen Orders</h1>
</header>

<main class="ticket-grid" id="ticket-grid">
    {% for ticket in tickets %}
        {% include "core/partials/kds_ticket.html" %}
    {% empty %}
        <div class="no-tickets">🎉 All Caught Up! 🎉</div>
    {% endfor %}
</main>

<script>
document.addEventListener('DOMContentLoaded', function () {

    const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
    const restaurantId = "{{ request.user.restaurant_id }}";

    const socket = new WebSocket(
        protocol + window.location.host + `/ws/kitchen/${restaurantId}/`
    );
    const grid = document.getElementById("ticket-grid");

    socket.onopen = () => console.log("✅ KDS connected");

    socket.onmessage = function (event) {
        const data = JSON.parse(event.data);
        console.log("📩 Update:", data);

        if (data.type === "new_ticket") {
            addTicket(data.ticket_html);
        }

        if (data.type === "status_update") {
            updateTicketStatus(data.ticket_id, data.new_status);
        }

        if (data.type === "remove_ticket") {
            removeTicket(data.ticket_id);
        }
    };

    socket.onerror = error => console.error("❌ WebSocket error:", error);
    socket.onclose = () => console.warn("⚠️ WebSocket closed");

    function addTicket(ticketHTML) {
        const emptyMessage = document.querySelector(".no-tickets");
        if (emptyMessage) emptyMessage.remove();

        grid.insertAdjacentHTML("afterbegin", ticketHTML);

        const newTicket = grid.firstElementChild;
        newTicket.classList.add("new-ticket");
    }

    function updateTicketStatus(ticketId, newStatus) {
        const ticket = document.getElementById(`ticket-${ticketId}`);
        if (!ticket) return;

        ticket.classList.remove("status-PREPARING", "status-READY");
        ticket.classList.add(`status-${newStatus}`);
    }

    function removeTicket(ticketId) {
        const ticket = document.getElementById(`ticket-${ticketId}`);
        if (!ticket) return;

        ticket.remove();

        if (!document.querySelector(".ticket")) {
            grid.innerHTML = `<div class="no-tickets">🎉 All Caught Up! 🎉</div>`;
        }
    }
});
</script>

{% endblock %}

{% extends "core/dashboard_base.html" %}

{% block title %}Close Register Shift{% endblock %}

{% block dashboard_content %}
<div class="container">
    <h2>Close Cashier Shift</h2>

    <p><strong>Started:</strong> {{ shift.start_time }}</p>
    <p><strong>Starting Cash:</strong> ${{ shift.starting_cash }}</p>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Counted Cash in Drawer</label>
            <input type="number" step="0.01" name="closing_cash" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-danger">
            Close Shift
        </button>

        <a href="{% url 'core:dashboard_home' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>
{% endblock %}

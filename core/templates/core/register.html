<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Restaurant Management</title>
    <style>
        :root {
    --primary: #6366f1;
    --bg: #f3f4f6;
    --card-bg: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --error: #dc2626;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 420px;
    padding: 20px;
}

.card {
    background: var(--card-bg);
    padding: 40px;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    margin-bottom: 30px;
    font-weight: 600;
    color: var(--text);
}

form p {
    display: flex;
    flex-direction: column;
    margin-bottom: 18px;
}

label {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text);
}

input {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #d1d5db;
    font-size: 14px;
    transition: 0.2s;
}

input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(99,102,241,0.15);
}

.helptext {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
}

ul {
    color: var(--error);
    font-size: 13px;
    padding-left: 16px;
}

button {
    margin-top: 10px;
    padding: 14px;
    border-radius: 8px;
    border: none;
    background: var(--primary);
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #4f46e5;
}

.login-link {
    margin-top: 24px;
    text-align: center;
    font-size: 14px;
}

.login-link a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
}
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Create an Account</h1>
            <form method="post">
                {% csrf_token %}
                
                {% if form.non_field_errors %}
                    <ul>
                        {% for error in form.non_field_errors %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}

                {{ form.as_p }}

                <button type="submit">Register</button>
            </form>
            <div class="login-link">
                Already have an account? <a href="{% url 'core:login' %}">Log In</a>
            </div>
        </div>
    </div>
</body>
</html>

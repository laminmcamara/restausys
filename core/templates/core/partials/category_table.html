<table class="table">
    <thead>
        <tr>
            <th>Name</th>
            <th>Products</th>
            <th>Status</th>
            <th style="text-align:right;">Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for category in categories %}
        <tr>
            <td><strong>{{ category.name }}</strong></td>

            <td>{{ category.product_count }}</td>

            <td>
                {% if category.is_active %}
                    <span class="status-badge status-open">Active</span>
                {% else %}
                    <span class="status-badge status-closed">Inactive</span>
                {% endif %}
            </td>

            <td style="text-align:right;">

                <!-- ✅ Edit -->
                <button
                    hx-get="{% url 'core:category_edit' category.id %}"
                    hx-target="#modal"
                    hx-swap="innerHTML"
                    class="btn btn-secondary">
                    Edit
                </button>

                <!-- ✅ Delete -->
                <button
                    hx-delete="{% url 'core:category_delete' category.id %}"
                    hx-target="#category-table"
                    hx-swap="innerHTML"
                    hx-confirm="Are you sure you want to delete this category?"
                    class="btn btn-danger">
                    Delete
                </button>

            </td>
        </tr>

        {% empty %}
        <tr>
            <td colspan="4" style="text-align:center; padding:40px;">
                No categories yet.
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

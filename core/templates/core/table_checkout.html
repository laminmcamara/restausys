<!DOCTYPE html>
<html>
<head>
    <title>Checkout | Table {{ table.table_number }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="font-family: system-ui; padding:16px; background:#f9fafb;">

<h1>Checkout - Table {{ table.table_number }}</h1>

{% if cart_items %}
    <ul>
        {% for item in cart_items %}
            <li>
                {{ item.product.name }} × {{ item.quantity }}
                - {{ item.total }}
            </li>
        {% endfor %}
    </ul>

    <h2>Total: {{ total }}</h2>

    <form method="post" action="{% url 'core:place-table-order' table.access_token %}">
        {% csrf_token %}
        <!-- ✅ Idempotency token -->
        <input type="hidden" name="nonce" value="{{ qr_nonce }}">
        <button type="submit">Confirm Order</button>
    </form>

{% else %}
    <p>Your cart is empty.</p>
{% endif %}

</body>
</html>

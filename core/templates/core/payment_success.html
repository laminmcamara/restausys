<!DOCTYPE html>
<html>
<head>
    <title>Payment Successful</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        .success {
            font-size: 24px;
            font-weight: 600;
            color: #16a34a;
            margin-bottom: 20px;
        }

        p {
            margin: 8px 0;
            color: #374151;
        }

        strong {
            color: #111827;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            background: #3b82f6;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="success">✅ Payment Successful</div>

    <p><strong>Restaurant:</strong> {{ restaurant.name }}</p>
    <p><strong>Order ID:</strong> {{ order.id }}</p>
    <p><strong>Total Paid:</strong> ${{ order.total }}</p>
    <p><strong>Date:</strong> {{ order.updated_at }}</p>

    <button onclick="window.location.href='{% url 'core:print_receipt' restaurant.slug order.id %}'">
        Print Receipt
    </button>
</div>

</body>
</html>

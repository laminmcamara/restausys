<!DOCTYPE html>
<html>
<head>
    <title>Payment Successful</title>
    <style>
        body { font-family: Arial; text-align:center; padding:40px; }
        .card { max-width:500px; margin:auto; padding:30px; border:1px solid #ddd; border-radius:8px; }
        .success { color:green; font-size:24px; margin-bottom:20px; }
        button { padding:10px 20px; margin-top:15px; cursor:pointer; }
    </style>
</head>
<body>
<div class="card">
    <div class="success">✅ Payment Successful</div>

    <p><strong>Restaurant:</strong> {{ restaurant.name }}</p>
    <p><strong>Order ID:</strong> {{ order.id }}</p>
    <p><strong>Total Paid:</strong> ${{ order.total }}</p>
    <p><strong>Date:</strong> {{ order.updated_at }}</p>

    <button onclick="window.location.href='{% url 'core:print_receipt' restaurant.slug order.id %}'">
        Print Receipt
    </button>
</div>
</body>
</html>

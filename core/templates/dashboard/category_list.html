{% extends "core/dashboard_base.html" %}
{% load static %}

{% block content %}

<div class="card">

    <!-- Header -->
    <div class="card-header-row">
        <div>
            <h2 class="page-title">Categories</h2>
            <div class="card-muted">Organize your menu sections</div>
        </div>

        <button 
            hx-get="{% url 'core:category_add' %}"
            hx-target="#modal"
            hx-swap="innerHTML"
            class="btn btn-primary">
            + Add Category
        </button>
    </div>

    <!-- Category Table -->
    <div id="category-table">
        {% include "core/partials/category_table.html" %}
    </div>

</div>

<!-- Modal Container -->
<div id="modal"></div>

{% endblock %}
